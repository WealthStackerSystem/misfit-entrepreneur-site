name: Scrape Live Blog Archive
# Pulls every post from the original Weebly blog, which is still live at
# www.misfitentrepreneur.com/blog/, and writes blog_archive.json.
#
# Data only. Does not modify the existing /blog/*.html pages.
#
# Run manually from the Actions tab.
on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install requests beautifulsoup4 --break-system-packages -q

      - name: Scrape the live blog
        run: python3 scrape_blog_live.py

      - name: Commit archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog_archive.json
          git diff --staged --quiet || git commit -m "Scrape live blog archive"
          git push
