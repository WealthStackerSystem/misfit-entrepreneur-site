name: Scrape & Build Blog Archive
on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install requests beautifulsoup4 --break-system-packages -q

      - name: Scrape blog posts from Wayback Machine
        run: python3 scrape_blogs.py

      - name: Build blog index page
        run: python3 build_blog_index.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Auto: Import blog archive from Wayback Machine"
          git push
