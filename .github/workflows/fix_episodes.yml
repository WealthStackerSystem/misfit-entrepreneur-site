name: Fix Episode Pages
on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix Spotify links and images across all episode pages
        run: python3 fix_episodes.py

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add episodes/
          git diff --staged --quiet || git commit -m "Auto: Fix Spotify links and images in episode pages"
          git pull --rebase origin main
          git push
