[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/about"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/podcast"
  to = "/podcast/"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/contact/"
  status = 301

[[redirects]]
  from = "/truths"
  to = "/truths/"
  status = 301

[[redirects]]
  from = "/playbook"
  to = "/playbook/"
  status = 301

[[headers]]
  for = "/netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
